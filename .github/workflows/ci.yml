name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The Edge Functions are type-checked with Deno (npm run typecheck:functions).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      # Expo writes expo-env.d.ts when the dev server starts (git-ignored by Expo's convention);
      # it loads Expo's types (e.g. Pressable's web `hovered` state), so tsc needs it here too.
      - run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      # Type checks (app and Edge Functions), lint and the Jest tests. No secrets are needed.
      - run: npm run check
